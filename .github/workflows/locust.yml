name: Manual Locust Load Test

on:
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Locust against example.org
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          if ! curl -sSf https://example.org >/dev/null; then
            echo "example.org is not reachable right now." >&2
            exit 1
          fi

          locust -f locustfile.py \
            --host https://example.org \
            --headless \
            -u 15 \
            -r 5 \
            -t 2m \
            --csv=artifacts/locust \
            --html=artifacts/locust_report.html \
            --logfile=artifacts/locust.log \
            --loglevel INFO

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: artifacts
